apiVersion: v1
kind: ConfigMap
metadata:
  name: repo2docker-backend-config
  namespace: {{ .Values.namespace }}
data:
  DATABASE_URL: {{ .Values.backend.env.databaseUrl | quote }}
  CORS_ORIGINS: {{ .Values.backend.env.corsOrigins | quote }}
  JENKINS_URL: {{ .Values.backend.env.jenkinsUrl | quote }}
  JENKINS_JOB_NAME: {{ .Values.backend.env.jenkinsJobName | quote }}
  DOCKERHUB_USERNAME: {{ .Values.backend.env.dockerhubUsername | quote }}
  GEMINI_MODEL: {{ .Values.backend.env.geminiModel | quote }}
  PREVIEW_DEPLOY_ENABLED: {{ .Values.backend.env.previewDeployEnabled | quote }}
  PREVIEW_BASE_URL: {{ .Values.backend.env.previewBaseUrl | quote }}
  PREVIEW_NAMESPACE_PREFIX: {{ .Values.backend.env.previewNamespacePrefix | quote }}
  OTEL_TRACING_ENABLED: {{ .Values.backend.env.otelTracingEnabled | quote }}
  OTEL_SERVICE_NAME: {{ .Values.backend.env.otelServiceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.backend.env.otelExporterOtlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_INSECURE: {{ .Values.backend.env.otelExporterOtlpInsecure | quote }}
