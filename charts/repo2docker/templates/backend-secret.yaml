apiVersion: v1
kind: Secret
metadata:
  name: repo2docker-backend-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  JENKINS_USERNAME: {{ .Values.backend.secrets.jenkinsUsername | quote }}
  JENKINS_API_TOKEN: {{ .Values.backend.secrets.jenkinsApiToken | quote }}
  GEMINI_API_KEY: {{ .Values.backend.secrets.geminiApiKey | quote }}
